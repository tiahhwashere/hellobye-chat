<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hellobye</title>
<style>
  /* ------------------------------------------------------------------
     HelloBye launch splash.
     A custom loading animation built entirely from CSS shapes + text.
     No emojis and no SVG icons are used anywhere here.
     ------------------------------------------------------------------ */
  :root {
    --accent: #5865f2;
    --accent-2: #8b93ff;
    --bg-0: #101116;
    --bg-1: #16171c;
    --text: #eceef1;
    --muted: #8a8d96;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% 0%, #1c1e26 0%, var(--bg-1) 42%, var(--bg-0) 100%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    -webkit-app-region: drag;               /* the splash can be dragged */
    opacity: 1; transition: opacity .38s ease;
  }
  html.hb-splash-hide body { opacity: 0; }

  /* Soft ambient glow behind the mark. */
  .glow {
    position: absolute; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(88,101,242,0.30) 0%, rgba(88,101,242,0.0) 68%);
    filter: blur(6px);
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(0.92); opacity: .55; }
    50%      { transform: scale(1.06); opacity: .95; }
  }

  .stage {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    gap: 22px; padding: 0 28px;
  }

  /* App mark (the same image as the website favicon / app icon). */
  .mark {
    width: 84px; height: 84px; border-radius: 22px;
    object-fit: cover; display: block;
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 18px 44px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.4);
    animation: float 3.4s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .wordmark {
    font-size: 21px; font-weight: 800; letter-spacing: .3px; color: #fff;
  }

  /* Pure-CSS ring spinner. */
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.10);
    border-top-color: var(--accent);
    border-right-color: var(--accent-2);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .label {
    font-size: 12.5px; color: var(--muted); letter-spacing: .4px;
    display: inline-flex; align-items: baseline;
  }
  /* Animated ellipsis made from three CSS dots (no characters, no icons). */
  .dots { display: inline-flex; gap: 3px; margin-left: 4px; }
  .dots i {
    width: 3px; height: 3px; border-radius: 50%; background: var(--muted);
    display: block; animation: dot 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes dot {
    0%, 100% { opacity: .25; transform: translateY(0); }
    50%      { opacity: 1; transform: translateY(-2px); }
  }

  /* Thin indeterminate progress bar along the bottom. */
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: rgba(255,255,255,0.05); overflow: hidden;
  }
  .bar span {
    position: absolute; top: 0; bottom: 0; width: 40%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 3px; animation: slide 1.5s cubic-bezier(.65,.05,.36,1) infinite;
  }
  @keyframes slide {
    0%   { left: -42%; }
    100% { left: 102%; }
  }
</style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div class="glow"></div>
  <div class="stage">
    <img class="mark" src="assets/icon.png" alt="">
    <div class="wordmark">Hellobye</div>
    <div class="spinner"></div>
    <div class="label">Loading<span class="dots"><i></i><i></i><i></i></span></div>
  </div>
  <div class="bar"><span></span></div>
</body>
</html>
